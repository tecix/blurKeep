<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <filter id="b" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>
  <!-- Background notes (blurred/dimmed) -->
  <rect x="2" y="5" width="14" height="11" rx="2" fill="#BDC1C6" filter="url(#b)"/>
  <rect x="32" y="5" width="14" height="11" rx="2" fill="#BDC1C6" filter="url(#b)"/>
  <rect x="2" y="32" width="14" height="11" rx="2" fill="#BDC1C6" filter="url(#b)"/>
  <rect x="32" y="32" width="14" height="11" rx="2" fill="#BDC1C6" filter="url(#b)"/>
  <!-- Focused note (center, sharp + highlighted) -->
  <rect x="11" y="14" width="26" height="20" rx="3" fill="#FBBC04"/>
  <line x1="16" y1="22" x2="32" y2="22" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="27" x2="32" y2="27" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="32" x2="25" y2="32" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
</svg>
